[package]
name = "overlay"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
napi = "3.16.1"
napi-derive = "3.7.0"
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.12.0"

[build-dependencies]
napi-build = "2.6.0"

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[profile.release]
strip = true

# Mechanical subset of the Google Rust style guide
# (https://google.github.io/styleguide/rustguide.html). Run `cargo clippy --all-targets`.
[lints.clippy]
wildcard_imports = "warn"
enum_glob_use = "warn"
unwrap_used = "warn"
missing_assert_message = "warn"
wildcard_enum_match_arm = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
undocumented_unsafe_blocks = "warn"
format_push_string = "warn"
string_add = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
